[project]
name = "immich-mcp"
version = "0.1.0"
description = "MCP server for the Immich photo server: photo search by people, tags, places, dates and content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
]

[project.scripts]
immich-mcp = "immich_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
